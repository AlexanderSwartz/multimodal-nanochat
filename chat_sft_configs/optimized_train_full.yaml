# Training Hyperparameters
train_vision_only: true
vision_lr: 1e-2
num_iterations: 500
total_batch_size: 32768
device_batch_size: 16
max_seq_len: 128
load_optimizer: 0

# Data & Model Pipeline
train_jsonl: "../COCO_data/coco_train.jsonl"
val_jsonl: "../COCO_data/coco_val.jsonl"
pin_memory: true

# Evaluation Settings
eval_every: 100
eval_tokens: 12800
eval_batch_size: 16
num_previews: 128

